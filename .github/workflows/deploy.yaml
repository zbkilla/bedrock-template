name: Deploy Bedrock Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  AGENT_NAME: my-bedrock-agent

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        working-directory: ./cdk
        run: npm ci

      - name: CDK Synth (validate)
        working-directory: ./cdk
        run: npx cdk synth --no-staging

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6'

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: CloudFormation Lint
        uses: scottbrenner/cfn-lint-action@v2
        with:
          args: cloudformation/template.yaml

      # Security scanning
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: cloudformation,terraform
          soft_fail: true
          output_format: cli

  deploy-cdk:
    name: Deploy with CDK
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      # Use OIDC authentication instead of long-lived credentials
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-bedrock-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        working-directory: ./cdk
        run: npm ci

      - name: Deploy CDK Stack
        working-directory: ./cdk
        run: |
          npx cdk deploy --require-approval never \
            -c agentName=${{ env.AGENT_NAME }}-${{ github.event.inputs.environment }} \
            -c autoPrepare=${{ github.event.inputs.environment == 'dev' && 'true' || 'false' }}

  test-agent:
    name: Test Agent
    needs: deploy-cdk
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      # Use OIDC authentication
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-bedrock-test
          aws-region: ${{ env.AWS_REGION }}

      - name: Test Agent Invocation
        run: |
          AGENT_ID=$(aws cloudformation describe-stacks \
            --stack-name BedrockAgentStack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.AGENT_NAME }}-${{ github.event.inputs.environment }}-agent-id'].OutputValue" \
            --output text)

          ALIAS_ID=$(aws cloudformation describe-stacks \
            --stack-name BedrockAgentStack \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.AGENT_NAME }}-${{ github.event.inputs.environment }}-alias-id'].OutputValue" \
            --output text)

          echo "Testing agent ${AGENT_ID} with alias ${ALIAS_ID}"

          # Test agent invocation and capture response
          RESPONSE=$(aws bedrock-agent-runtime invoke-agent \
            --agent-id ${AGENT_ID} \
            --agent-alias-id ${ALIAS_ID} \
            --session-id "test-$(date +%s)" \
            --input-text "Hello, can you help me?" \
            --output text 2>&1) || true

          echo "Agent Response: ${RESPONSE}"

          # Basic validation - ensure we got a response
          if [ -z "${RESPONSE}" ]; then
            echo "ERROR: No response received from agent"
            exit 1
          fi

          echo "✅ Agent test passed"
